<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- exam answer sheet v6 -->
<title>กระดาษคำตอบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@500;600&family=Noto+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F5F0; --paper-edge:#EDEAE1; --ink:#232323; --ink-soft:#5B5A54;
    --rule:#D9D5C9; --seal:#8A6A3B; --seal-soft:#B79A6B; --danger:#A14A3E; --good:#4C7A54;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--paper-edge); color:var(--ink); font-family:'Noto Sans Thai','Inter',sans-serif; min-height:100vh; display:flex; justify-content:center; padding:0 0 130px 0; }
  .sheet{ width:100%; max-width:640px; background:var(--paper); min-height:100vh; padding:24px 18px 30px; }
  header.top{ border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:16px; }
  .eyebrow{ font-family:'Inter',sans-serif; font-size:10px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--seal); margin-bottom:5px; }
  h1{ font-family:'Noto Serif Thai',serif; font-weight:600; font-size:22px; margin:0 0 12px 0; }
  .meta-row{ display:flex; gap:12px; flex-wrap:wrap; }
  .meta-field{ flex:1 1 130px; }
  .meta-field label{ display:block; font-family:'Inter',sans-serif; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:3px; }
  .meta-field input{ width:100%; border:none; border-bottom:1px solid var(--rule); background:transparent; font-family:'Noto Sans Thai',sans-serif; font-size:13px; color:var(--ink); padding:4px 2px; }
  .meta-field input:focus{ outline:none; border-bottom-color:var(--seal); }

  .import-box{ margin-bottom:16px; }
  .import-toggle{ border:1px dashed var(--seal-soft); background:none; color:var(--seal); font-family:'Inter',sans-serif; font-size:11px; font-weight:600; padding:8px 14px; border-radius:2px; cursor:pointer; width:100%; }
  .import-panel{ display:none; margin-top:8px; border:1px solid var(--rule); background:#FFFEFC; padding:10px; }
  .import-panel textarea{ width:100%; min-height:90px; font-family:'IBM Plex Mono',monospace; font-size:12px; border:1px solid var(--rule); padding:8px; }
  .import-actions{ display:flex; gap:8px; margin-top:8px; }
  .btn-small{ font-family:'Inter',sans-serif; font-size:11px; font-weight:600; padding:7px 12px; border-radius:2px; cursor:pointer; border:none; }
  .btn-primary{ background:var(--ink); color:var(--paper); }
  .btn-primary:hover{ background:var(--seal); }
  .btn-ghost{ background:none; color:var(--ink-soft); text-decoration:underline; }
  .import-error{ color:var(--danger); font-size:11px; font-family:'Inter',sans-serif; margin-top:6px; }

  .score-bar{ font-family:'Inter',sans-serif; font-size:12px; font-weight:600; color:var(--seal); border:1px solid var(--seal-soft); background:#FBF6EC; padding:8px 12px; border-radius:2px; margin-bottom:14px; display:none; align-items:center; gap:10px; }
  .score-bar .redo{ font-weight:600; text-decoration:underline; cursor:pointer; color:var(--ink-soft); font-size:11px; margin-left:auto; }

  .card{ border:1px solid var(--rule); border-radius:2px; margin-bottom:16px; background:#FFFEFC; }
  .card-head{ display:flex; align-items:center; justify-content:space-between; padding:9px 12px; border-bottom:1px solid var(--rule); background:var(--paper-edge); gap:8px; }
  .card-num-wrap{ display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
  .card-num{ font-family:'Inter',sans-serif; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--seal); white-space:nowrap; }
  .tag-input{ border:none; background:transparent; font-family:'Inter',sans-serif; font-size:11px; color:var(--ink-soft); flex:1; min-width:0; }
  .tag-input:focus{ outline:none; }
  .tag-input::placeholder{ color:#C9C4B6; }
  .pending-badge{ font-family:'Inter',sans-serif; font-size:9px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); border:1px solid var(--rule); background:var(--paper); padding:2px 6px; border-radius:2px; white-space:nowrap; }
  .card-actions{ display:flex; gap:10px; }
  .icon-btn{ border:none; background:none; cursor:pointer; font-family:'Inter',sans-serif; font-size:11px; color:var(--ink-soft); padding:2px 4px; white-space:nowrap; }
  .icon-btn:hover{ color:var(--ink); }
  .icon-btn.danger:hover{ color:var(--danger); }

  .q-text{ font-family:'Noto Serif Thai',serif; font-size:16px; padding:12px 12px 4px; color:var(--ink); }
  .q-text-input{ width:100%; border:none; background:transparent; font-family:'Noto Serif Thai',serif; font-size:15px; padding:12px 12px 4px; color:var(--ink); }
  .q-text-input::placeholder{ color:#B7B3A6; font-family:'Noto Sans Thai',sans-serif; }

  textarea.a-input{ width:100%; border:none; background:transparent; resize:none; overflow:hidden; padding:10px 12px; color:var(--ink); line-height:1.65; font-family:'IBM Plex Mono','Noto Sans Thai',monospace; font-size:15px; min-height:100px; }
  textarea.a-input:focus{ outline:none; }
  textarea.a-input::placeholder{ color:#B7B3A6; font-family:'Noto Sans Thai',sans-serif; }
  .wordcount{ font-family:'Inter',sans-serif; font-size:10px; color:#B7B3A6; text-align:right; padding:0 12px 10px; }

  .match-wrap{ padding:8px 12px 4px; }
  .match-row{ display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--rule); }
  .match-left{ flex:1; font-size:14px; min-width:0; }
  .match-row select{ flex:1; min-width:130px; font-family:'Noto Sans Thai',sans-serif; font-size:13px; padding:5px; border:1px solid var(--seal-soft); border-radius:2px; background:#fff; color:var(--ink); }
  .match-row.row-correct{ background:#F1F6F1; }
  .match-row.row-wrong{ background:#FBF0EE; }

  .order-wrap{ padding:8px 12px 4px; }
  .order-item{ display:flex; align-items:center; gap:8px; padding:8px; border:1px solid var(--rule); border-radius:2px; margin-bottom:6px; background:#fff; font-size:14px; }
  .order-num{ font-family:'Inter',sans-serif; font-size:11px; font-weight:600; color:var(--seal); min-width:18px; }
  .order-text{ flex:1; min-width:0; }
  .order-btns{ display:flex; gap:4px; }
  .order-btns button{ border:1px solid var(--rule); background:var(--paper-edge); cursor:pointer; font-size:13px; width:28px; height:28px; border-radius:2px; color:var(--ink); }
  .order-btns button:hover{ background:var(--seal-soft); }
  .order-btns button:disabled{ opacity:.3; cursor:default; }
  .order-item.row-correct{ border-color:var(--good); background:#F1F6F1; }
  .order-item.row-wrong{ border-color:var(--danger); background:#FBF0EE; }

  .pool-wrap{ padding:10px 12px 2px; }
  .pool-label{ font-family:'Inter',sans-serif; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; }
  .pool{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ border:1px solid var(--seal-soft); background:#FFFEFC; color:var(--ink); font-family:'Noto Sans Thai',sans-serif; font-size:13px; padding:5px 10px; border-radius:2px; cursor:pointer; }
  .chip:hover{ background:#FBF6EC; }
  .chip.sel{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .chip.used{ opacity:.42; }
  .chip:disabled{ cursor:default; }
  .pool-hint{ font-family:'Inter',sans-serif; font-size:11px; color:var(--ink-soft); margin-top:7px; }
  .slot{ width:100%; min-width:120px; min-height:30px; border:1px dashed var(--seal-soft); border-radius:2px; background:#fff; padding:5px 8px; font-family:'Noto Sans Thai',sans-serif; font-size:13px; color:var(--ink); cursor:pointer; text-align:left; }
  .slot.empty{ color:var(--ink-soft); }
  .slot.armed{ border-style:solid; border-color:var(--ink); background:#FBF6EC; }
  .slot:disabled{ cursor:default; }
  .fu-wrap{ border-top:1px solid var(--rule); margin-top:8px; }
  .fu{ padding:10px 12px; border-bottom:1px solid var(--rule); }
  .fu:last-child{ border-bottom:none; }
  .fu-num{ font-family:'Inter',sans-serif; font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--seal); }
  .fu-q{ font-family:'Noto Serif Thai',serif; font-size:14px; margin:4px 0 7px; }
  .fu textarea{ width:100%; border:1px solid var(--rule); background:#fff; resize:vertical; padding:8px; color:var(--ink); line-height:1.6; font-family:'IBM Plex Mono','Noto Sans Thai',monospace; font-size:14px; min-height:70px; border-radius:2px; }
  .table-wrap{ padding:8px 12px 4px; overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-family:'Inter',sans-serif; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); border-bottom:2px solid var(--ink); padding:6px 8px; white-space:nowrap; }
  td{ border-bottom:1px solid var(--rule); padding:6px 8px; font-family:'Noto Sans Thai',sans-serif; }
  td select{ width:100%; min-width:140px; font-family:'Noto Sans Thai',sans-serif; font-size:13px; padding:5px; border:1px solid var(--seal-soft); border-radius:2px; background:#fff; color:var(--ink); }
  td.cell-correct{ background:#F1F6F1; }
  td.cell-wrong{ background:#FBF0EE; }

  .choices{ padding:6px 12px 4px; }
  .choice{ display:flex; align-items:flex-start; gap:8px; padding:7px 8px; border:1px solid var(--rule); border-radius:2px; margin-bottom:6px; cursor:pointer; font-size:14px; }
  .choice:hover{ background:var(--paper-edge); }
  .choice input{ margin-top:3px; }
  .choice.correct{ border-color:var(--good); background:#F1F6F1; }
  .choice.wrong{ border-color:var(--danger); background:#FBF0EE; }
  .check-row{ padding:2px 12px 12px; }
  .check-result{ font-family:'Inter',sans-serif; font-size:12px; font-weight:600; }
  .check-result.correct{ color:var(--good); }
  .check-result.wrong{ color:var(--danger); }
  .check-result.unanswered{ color:var(--ink-soft); font-weight:500; }

  .add-row{ display:flex; justify-content:center; margin-top:4px; }
  .add-btn{ border:1px dashed var(--seal-soft); background:none; color:var(--seal); font-family:'Inter',sans-serif; font-size:12px; font-weight:600; padding:10px 20px; border-radius:2px; cursor:pointer; width:100%; }
  .add-btn:hover{ background:#FBF6EC; }

  .bottom-bar{ position:fixed; left:0; right:0; bottom:0; background:var(--paper); border-top:2px solid var(--ink); padding:10px 14px; display:flex; justify-content:center; z-index:10; }
  .bottom-inner{ width:100%; max-width:640px; display:flex; flex-direction:column; gap:8px; }
  .bottom-row{ display:flex; align-items:center; gap:10px; }
  .clear-link{ background:none; border:none; font-family:'Inter',sans-serif; font-size:12px; color:var(--ink-soft); text-decoration:underline; cursor:pointer; padding:4px 0; }
  .clear-link:hover{ color:var(--danger); }
  .spacer{ flex:1; }
  .btn-wide{ flex:1; border:none; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; padding:12px 16px; border-radius:2px; cursor:pointer; }
  .submit-btn{ background:var(--seal); color:#fff; }
  .submit-btn:hover{ background:#75592F; }
  .export-btn{ background:var(--ink); color:var(--paper); }
  .export-btn:hover{ background:#000; }
  .toast{ position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(8px); background:var(--ink); color:var(--paper); font-family:'Inter',sans-serif; font-size:12px; padding:8px 16px; border-radius:2px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:20; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .loading{ text-align:center; font-family:'Inter',sans-serif; font-size:12px; color:var(--ink-soft); padding:20px; }
</style>
</head>
<body>

<div class="sheet">
  <header class="top">
    <div class="eyebrow">Answer Sheet</div>
    <h1>กระดาษคำตอบ</h1>
    <div class="meta-row">
      <div class="meta-field"><label>วิชา</label><input type="text" id="subject" placeholder="เช่น เภสัชอุตสาหการ"></div>
      <div class="meta-field"><label>วันที่</label><input type="text" id="examdate" placeholder="วว/ดด/ปป"></div>
    </div>
  </header>

  <div class="import-box">
    <button class="import-toggle" onclick="toggleImport()">+ นำเข้าข้อสอบ (JSON จาก Claude)</button>
    <div class="import-panel" id="importPanel">
      <textarea id="importText" placeholder='วางโค้ด JSON ที่ Claude สร้างให้ ตรงนี้...'></textarea>
      <div class="import-actions">
        <button class="btn-small btn-primary" onclick="doImport()">นำเข้า (แทนที่ทั้งหมด)</button>
        <button class="btn-small btn-ghost" onclick="toggleImport()">ยกเลิก</button>
      </div>
      <div class="import-error" id="importError"></div>
    </div>
  </div>

  <div class="score-bar" id="scoreBar"></div>

  <div id="loading" class="loading">กำลังโหลด...</div>
  <div id="cards" style="display:none;"></div>
  <div class="add-row"><button class="add-btn" onclick="addCard()">+ เพิ่มข้อเขียนเอง</button></div>
</div>

<div class="bottom-bar">
  <div class="bottom-inner">
    <div class="bottom-row">
      <button class="btn-wide submit-btn" onclick="submitAll()">ส่งคำตอบทั้งหมด</button>
      <button class="btn-wide export-btn" onclick="copyAll()">Export ไปแชท</button>
    </div>
    <div class="bottom-row">
      <button class="clear-link" onclick="clearAll()">ล้างทั้งหมด</button>
    </div>
  </div>
</div>
<div class="toast" id="toast">คัดลอกแล้ว</div>

<script>
const KEY = 'exam-answer-sheet';
let state = { subject:'', examdate:'', submitted:false, cards:[{ kind:'open', tag:'', question:'', a:'' }] };
let saveTimer = null;

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ state = JSON.parse(raw); }
  }catch(e){}
  if(!state.cards || state.cards.length === 0){ state.cards = [{ kind:'open', tag:'', question:'', a:'' }]; }
  if(typeof state.submitted !== 'boolean'){ state.submitted = false; }
  document.getElementById('subject').value = state.subject || '';
  document.getElementById('examdate').value = state.examdate || '';
  document.getElementById('loading').style.display = 'none';
  document.getElementById('cards').style.display = 'block';
  renderCards();
}

function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); }
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ console.error('บันทึกไม่สำเร็จ', e); }
}

function autoGrow(el){ el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

function toggleImport(){
  const p = document.getElementById('importPanel');
  p.style.display = p.style.display === 'block' ? 'none' : 'block';
  document.getElementById('importError').textContent = '';
}

function normBlanks(r){
  if(Array.isArray(r.blanks) && r.blanks.length){
    return r.blanks.map(b => ({ col:b.col, choices:Array.isArray(b.choices)?b.choices:null, answerIndex:b.answerIndex, userChoice:null }));
  }
  if(typeof r.blankCol === 'number'){
    return [{ col:r.blankCol, choices:Array.isArray(r.choices)?r.choices:null, answerIndex:r.answerIndex, userChoice:null }];
  }
  return [];
}
function normFollowups(item){
  return (Array.isArray(item.followups)?item.followups:[]).map(f => ({
    kind: f.type === 'mcq' ? 'mcq' : 'open',
    question: f.question || '',
    choices: Array.isArray(f.choices) ? f.choices : [],
    answerIndex: f.answerIndex,
    userChoice: null,
    a: ''
  }));
}
function shuffleKeepDiff(src){
  const arr = src.map((t, idx) => ({ text:t, orig:idx }));
  if(arr.length < 2) return arr;
  for(let pass = 0; pass < 25; pass++){
    for(let k = arr.length - 1; k > 0; k--){
      const j = Math.floor(Math.random() * (k + 1));
      [arr[k], arr[j]] = [arr[j], arr[k]];
    }
    if(!arr.every((it, ii) => it.orig === ii)) return arr;
  }
  [arr[0], arr[1]] = [arr[1], arr[0]];
  return arr;
}

function validateItems(data){
  const errs = [], warns = [];
  const inRange = (idx, arr) => typeof idx === 'number' && Array.isArray(arr) && idx >= 0 && idx < arr.length;

  data.forEach((item, i) => {
    const no = `ข้อ ${i+1}`;
    const t = item.type;

    if(t === 'mcq'){
      if(!Array.isArray(item.choices) || item.choices.length < 2) errs.push(`${no} (mcq): ต้องมี choices อย่างน้อย 2 ตัว`);
      else if(!inRange(item.answerIndex, item.choices)) errs.push(`${no} (mcq): answerIndex=${item.answerIndex} เกินขอบเขต choices (มี ${item.choices.length} ตัว) → ตอบถูกไม่ได้`);
    }

    if(t === 'table'){
      const pool = Array.isArray(item.pool) ? item.pool : null;
      const nCols = Array.isArray(item.columns) ? item.columns.length : null;
      (Array.isArray(item.rows)?item.rows:[]).forEach((r, ri) => {
        const rn = `${no} แถว ${ri+1}`;
        if(nCols !== null && Array.isArray(r.values) && r.values.length !== nCols)
          warns.push(`${rn}: values มี ${r.values.length} ช่อง แต่ columns มี ${nCols} ช่อง`);
        const blanks = Array.isArray(r.blanks) && r.blanks.length ? r.blanks
                     : (typeof r.blankCol === 'number' ? [{col:r.blankCol, choices:r.choices, answerIndex:r.answerIndex}] : []);
        blanks.forEach(b => {
          const opts = Array.isArray(b.choices) ? b.choices : pool;
          if(!opts || opts.length === 0) errs.push(`${rn} คอลัมน์ ${b.col}: ไม่มีทั้ง pool และ choices → ช่องนี้ตอบไม่ได้เลย`);
          else if(!inRange(b.answerIndex, opts)) errs.push(`${rn} คอลัมน์ ${b.col}: answerIndex=${b.answerIndex} เกินขอบเขต (มี ${opts.length} ตัว) → ตอบถูกไม่ได้`);
          if(Array.isArray(r.values) && r.values[b.col] !== '' && r.values[b.col] !== undefined)
            warns.push(`${rn} คอลัมน์ ${b.col}: values ตำแหน่งนี้ควรเป็น "" แต่เป็น "${r.values[b.col]}"`);
        });
      });
    }

    if(t === 'match'){
      if(!Array.isArray(item.choices) || item.choices.length === 0) errs.push(`${no} (match): ไม่มี choices → ตอบไม่ได้`);
      else (Array.isArray(item.pairs)?item.pairs:[]).forEach((p, pi) => {
        if(!inRange(p.answerIndex, item.choices)) errs.push(`${no} (match) คู่ที่ ${pi+1}: answerIndex=${p.answerIndex} เกินขอบเขต choices (มี ${item.choices.length} ตัว)`);
      });
    }

    if(t === 'order'){
      const n = Array.isArray(item.items) ? item.items.length : 0;
      if(n < 2) errs.push(`${no} (order): มี ${n} รายการ ต้องมีอย่างน้อย 2 (ไม่งั้นได้คะแนนฟรี)`);
    }

    (Array.isArray(item.followups)?item.followups:[]).forEach((f, fi) => {
      if(f.type === 'mcq'){
        if(!Array.isArray(f.choices) || f.choices.length < 2) errs.push(`${no} followup ${fi+1}: mcq ต้องมี choices อย่างน้อย 2 ตัว`);
        else if(!inRange(f.answerIndex, f.choices)) errs.push(`${no} followup ${fi+1}: answerIndex=${f.answerIndex} เกินขอบเขต`);
      }
    });
  });
  return { errs, warns };
}

function doImport(){
  const raw = document.getElementById('importText').value.trim();
  const errEl = document.getElementById('importError');
  errEl.textContent = '';
  let data;
  try{ data = JSON.parse(raw); }
  catch(e){ errEl.textContent = 'JSON ไม่ถูกต้อง ตรวจสอบรูปแบบอีกครั้ง'; return; }
  if(!Array.isArray(data) || data.length === 0){ errEl.textContent = 'ต้องเป็น array ของข้อสอบอย่างน้อย 1 ข้อ'; return; }

  const { errs, warns } = validateItems(data);
  if(errs.length){
    errEl.innerHTML = '<b>ไม่นำเข้า — เจอข้อที่ตอบถูกไม่ได้ ' + errs.length + ' จุด:</b><br>'
      + errs.map(e => '• ' + escapeHtml(e)).join('<br>')
      + '<br><br>ให้ Claude แก้ JSON ตามนี้แล้วลองใหม่';
    return;
  }
  if(warns.length){
    errEl.innerHTML = '<b style="color:var(--seal)">นำเข้าแล้ว แต่มีจุดน่าสงสัย ' + warns.length + ' จุด:</b><br>'
      + warns.map(w => '• ' + escapeHtml(w)).join('<br>');
  }
  const cards = data.map(item => {
    if(item.type === 'mcq'){
      return { kind:'mcq', tag:item.tag||'', question:item.question||'', choices:Array.isArray(item.choices)?item.choices:[], answerIndex:item.answerIndex, userChoice:null, followups:normFollowups(item) };
    }
    if(item.type === 'table'){
      const rows = (Array.isArray(item.rows)?item.rows:[]).map(r => ({
        values: Array.isArray(r.values) ? r.values : [],
        blanks: normBlanks(r)
      }));
      return { kind:'table', tag:item.tag||'', question:item.question||'',
        columns:Array.isArray(item.columns)?item.columns:[],
        pool: Array.isArray(item.pool) ? item.pool : null,
        poolMode: item.poolMode === 'tap' ? 'tap' : 'dropdown',
        poolSel: null, rows, followups: normFollowups(item) };
    }
    if(item.type === 'match'){
      const pairs = (Array.isArray(item.pairs)?item.pairs:[]).map(p => ({
        left: p.left || '', answerIndex: p.answerIndex, userChoice: null
      }));
      return { kind:'match', tag:item.tag||'', question:item.question||'', choices:Array.isArray(item.choices)?item.choices:[], pairs, followups:normFollowups(item) };
    }
    if(item.type === 'order'){
      const src = Array.isArray(item.items) ? item.items : [];
      const shuffled = shuffleKeepDiff(src);
      return { kind:'order', tag:item.tag||'', question:item.question||'', items:shuffled, followups:normFollowups(item) };
    }
    return { kind:'open', tag:item.tag||'', question:item.question||'', a:'', followups:normFollowups(item) };
  });
  state.cards = cards;
  state.submitted = false;
  scheduleSave();
  renderCards();
  if(!warns.length) toggleImport();
  document.getElementById('importText').value = '';
  showToast('นำเข้าข้อสอบแล้ว ' + cards.length + ' ข้อ' + (warns.length ? ' (มีข้อความเตือน)' : ''));
}

function renderCards(){
  const wrap = document.getElementById('cards');
  wrap.innerHTML = '';
  state.cards.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    const tagVal = (card.tag||'').replace(/"/g,'&quot;');
    let body = '';
    let badge = '';

    if(card.kind === 'mcq'){
      const qHtml = card.question ? `<div class="q-text">${escapeHtml(card.question)}</div>` : '';
      const choicesHtml = (card.choices||[]).map((c, ci) => {
        let cls = 'choice';
        if(state.submitted){
          if(ci === card.answerIndex) cls += ' correct';
          else if(ci === card.userChoice) cls += ' wrong';
        }
        const checkedAttr = card.userChoice === ci ? 'checked' : '';
        return `<label class="${cls}"><input type="radio" name="mcq-${i}" ${checkedAttr} ${state.submitted?'disabled':''} onchange="setChoice(${i},${ci})"><span>${escapeHtml(c)}</span></label>`;
      }).join('');
      let resultHtml = '';
      if(state.submitted){
        if(card.userChoice === null || card.userChoice === undefined){
          resultHtml = `<span class="check-result unanswered">— ไม่ได้เลือกคำตอบ</span>`;
        } else {
          const ok = card.userChoice === card.answerIndex;
          resultHtml = `<span class="check-result ${ok?'correct':'wrong'}">${ok?'✓ ถูกต้อง':'✗ ไม่ถูก'}</span>`;
        }
      }
      body = `${qHtml}<div class="choices">${choicesHtml}</div><div class="check-row">${resultHtml}</div>`;
    } else if(card.kind === 'table'){
      const qHtml = card.question ? `<div class="q-text">${escapeHtml(card.question)}</div>` : '';
      const tapMode = card.poolMode === 'tap' && Array.isArray(card.pool) && card.pool.length > 0;
      const usedIdx = new Set();
      (card.rows||[]).forEach(r => (r.blanks||[]).forEach(b => {
        if(b.userChoice !== null && b.userChoice !== undefined && !b.choices) usedIdx.add(b.userChoice);
      }));
      let poolHtml = '';
      if(tapMode){
        const chips = card.pool.map((c, pi) => {
          let cls = 'chip';
          if(card.poolSel === pi) cls += ' sel';
          if(usedIdx.has(pi)) cls += ' used';
          return `<button class="${cls}" ${state.submitted?'disabled':''} onclick="selectChip(${i},${pi})">${escapeHtml(c)}</button>`;
        }).join('');
        poolHtml = `<div class="pool-wrap"><div class="pool-label">ตัวเลือก (ใช้ซ้ำได้ มีตัวลวงปนอยู่)</div>
          <div class="pool">${chips}</div>
          <div class="pool-hint">แตะตัวเลือกด้านบน แล้วแตะช่องว่างในตาราง · แตะช่องที่เติมแล้วเพื่อล้าง</div></div>`;
      }
      const headHtml = '<tr>' + (card.columns||[]).map(c => `<th>${escapeHtml(c)}</th>`).join('') + '</tr>';
      const rowsHtml = (card.rows||[]).map((row, ri) => {
        const cellsHtml = (row.values||[]).map((v, ci) => {
          const bi = (row.blanks||[]).findIndex(b => b.col === ci);
          if(bi === -1) return `<td>${escapeHtml(v)}</td>`;
          const b = row.blanks[bi];
          const opts = b.choices || card.pool || [];
          let tdCls = '';
          if(state.submitted && b.userChoice !== null && b.userChoice !== undefined){
            tdCls = b.userChoice === b.answerIndex ? 'cell-correct' : 'cell-wrong';
          }
          if(tapMode && !b.choices){
            const filled = (b.userChoice !== null && b.userChoice !== undefined);
            const armed = (!filled && card.poolSel !== null && card.poolSel !== undefined) ? ' armed' : '';
            const label = filled ? escapeHtml(opts[b.userChoice]) : '— แตะเพื่อเติม —';
            return `<td class="${tdCls}"><button class="slot${filled?'':' empty'}${armed}" ${state.submitted?'disabled':''} onclick="tapSlot(${i},${ri},${bi})">${label}</button></td>`;
          }
          const optsHtml = opts.map((c, chi) => {
            const sel = b.userChoice === chi ? 'selected' : '';
            return `<option value="${chi}" ${sel}>${escapeHtml(c)}</option>`;
          }).join('');
          const ph = (b.userChoice === null || b.userChoice === undefined) ? 'selected' : '';
          return `<td class="${tdCls}"><select ${state.submitted?'disabled':''} onchange="setBlank(${i},${ri},${bi},this.value)">
            <option value="" disabled ${ph}>-- เลือก --</option>${optsHtml}</select></td>`;
        }).join('');
        return `<tr>${cellsHtml}</tr>`;
      }).join('');
      const allBlanks = (card.rows||[]).flatMap(r => r.blanks||[]);
      let resultHtml = '';
      if(state.submitted && allBlanks.length){
        const ok = allBlanks.filter(b => b.userChoice === b.answerIndex).length;
        resultHtml = `<div class="check-row"><span class="check-result ${ok===allBlanks.length?'correct':'wrong'}">ถูก ${ok}/${allBlanks.length}</span></div>`;
      }
      body = `${qHtml}${poolHtml}<div class="table-wrap"><table>${headHtml}${rowsHtml}</table></div>${resultHtml}`;
    } else if(card.kind === 'match'){
      const qHtml = card.question ? `<div class="q-text">${escapeHtml(card.question)}</div>` : '';
      const rowsHtml = (card.pairs||[]).map((p, pi) => {
        const optsHtml = (card.choices||[]).map((c, chi) => {
          const sel = p.userChoice === chi ? 'selected' : '';
          return `<option value="${chi}" ${sel}>${escapeHtml(c)}</option>`;
        }).join('');
        let cls = 'match-row';
        if(state.submitted && p.userChoice !== null && p.userChoice !== undefined){
          cls += p.userChoice === p.answerIndex ? ' row-correct' : ' row-wrong';
        }
        const ph = (p.userChoice === null || p.userChoice === undefined) ? 'selected' : '';
        return `<div class="${cls}"><span class="match-left">${escapeHtml(p.left)}</span>
          <select ${state.submitted?'disabled':''} onchange="setMatchChoice(${i},${pi},this.value)">
          <option value="" disabled ${ph}>-- เลือก --</option>${optsHtml}</select></div>`;
      }).join('');
      let resultHtml = '';
      if(state.submitted && (card.pairs||[]).length){
        const ok = card.pairs.filter(p => p.userChoice === p.answerIndex).length;
        resultHtml = `<div class="check-row"><span class="check-result ${ok===card.pairs.length?'correct':'wrong'}">ถูก ${ok}/${card.pairs.length}</span></div>`;
      }
      body = `${qHtml}<div class="match-wrap">${rowsHtml}</div>${resultHtml}`;
    } else if(card.kind === 'order'){
      const qHtml = card.question ? `<div class="q-text">${escapeHtml(card.question)}</div>` : '';
      const itemsHtml = (card.items||[]).map((it, ii) => {
        let cls = 'order-item';
        if(state.submitted){ cls += (it.orig === ii) ? ' row-correct' : ' row-wrong'; }
        const upDis = (ii === 0 || state.submitted) ? 'disabled' : '';
        const dnDis = (ii === card.items.length-1 || state.submitted) ? 'disabled' : '';
        return `<div class="${cls}">
          <span class="order-num">${ii+1}</span>
          <span class="order-text">${escapeHtml(it.text)}</span>
          <span class="order-btns">
            <button ${upDis} onclick="moveItem(${i},${ii},-1)">↑</button>
            <button ${dnDis} onclick="moveItem(${i},${ii},1)">↓</button>
          </span></div>`;
      }).join('');
      let resultHtml = '';
      if(state.submitted && (card.items||[]).length){
        const ok = card.items.filter((it, ii) => it.orig === ii).length;
        const allRight = ok === card.items.length;
        const detail = allRight ? 'ลำดับถูกทั้งหมด' : `ผิดลำดับ (ถูกตำแหน่ง ${ok}/${card.items.length} — ข้อนี้คิดแบบเต็มหรือศูนย์)`;
        resultHtml = `<div class="check-row"><span class="check-result ${allRight?'correct':'wrong'}">${detail}</span></div>`;
      }
      body = `${qHtml}<div class="order-wrap">${itemsHtml}</div>${resultHtml}`;
    } else {
      const qHtml = card.question
        ? `<div class="q-text">${escapeHtml(card.question)}</div>`
        : `<input class="q-text-input" data-idx="${i}" data-field="question" placeholder="พิมพ์โจทย์ (ถ้าต้องการ)" value="${(card.question||'').replace(/"/g,'&quot;')}">`;
      body = `
        ${qHtml}
        <textarea class="a-input" data-idx="${i}" data-field="a" placeholder="เขียนคำตอบข้อนี้ที่นี่...">${card.a || ''}</textarea>
        <div class="wordcount" id="wc-${i}"></div>
      `;
      if(state.submitted){ badge = `<span class="pending-badge">รอตรวจ</span>`; }
    }

    if((card.followups||[]).length){
      const fuHtml = card.followups.map((f, fi) => {
        const head = `<div class="fu-num">คำถามต่อเนื่อง ${fi+1}</div><div class="fu-q">${escapeHtml(f.question)}</div>`;
        if(f.kind === 'mcq'){
          const ch = (f.choices||[]).map((c, ci) => {
            let cls = 'choice';
            if(state.submitted){
              if(ci === f.answerIndex) cls += ' correct';
              else if(ci === f.userChoice) cls += ' wrong';
            }
            const chk = f.userChoice === ci ? 'checked' : '';
            return `<label class="${cls}"><input type="radio" name="fu-${i}-${fi}" ${chk} ${state.submitted?'disabled':''} onchange="setFollowup(${i},${fi},${ci})"><span>${escapeHtml(c)}</span></label>`;
          }).join('');
          let res = '';
          if(state.submitted){
            if(f.userChoice === null || f.userChoice === undefined) res = `<span class="check-result unanswered">— ไม่ได้เลือกคำตอบ</span>`;
            else { const ok = f.userChoice === f.answerIndex; res = `<span class="check-result ${ok?'correct':'wrong'}">${ok?'✓ ถูกต้อง':'✗ ไม่ถูก'}</span>`; }
          }
          return `<div class="fu">${head}<div class="choices">${ch}</div><div class="check-row">${res}</div></div>`;
        }
        const badgeFu = state.submitted ? `<span class="pending-badge">รอตรวจ</span>` : '';
        return `<div class="fu">${head}<textarea data-fuidx="${i}" data-fu="${fi}" placeholder="เขียนคำตอบข้อนี้...">${f.a||''}</textarea><div class="check-row">${badgeFu}</div></div>`;
      }).join('');
      body += `<div class="fu-wrap">${fuHtml}</div>`;
    }

    el.innerHTML = `
      <div class="card-head">
        <div class="card-num-wrap">
          <span class="card-num">ข้อ ${i+1}</span>
          <input class="tag-input" data-idx="${i}" data-field="tag" placeholder="หัวข้อย่อ" value="${tagVal}">
          ${badge}
        </div>
        <div class="card-actions">
          <button class="icon-btn danger" onclick="removeCard(${i})">ลบ</button>
        </div>
      </div>
      ${body}
    `;
    wrap.appendChild(el);
  });

  wrap.querySelectorAll('textarea.a-input').forEach(t => {
    autoGrow(t);
    updateCount(t.dataset.idx);
    t.addEventListener('input', () => {
      state.cards[t.dataset.idx].a = t.value;
      autoGrow(t);
      updateCount(t.dataset.idx);
      scheduleSave();
    });
  });
  wrap.querySelectorAll('textarea[data-fu]').forEach(t => {
    autoGrow(t);
    t.addEventListener('input', () => {
      state.cards[t.dataset.fuidx].followups[t.dataset.fu].a = t.value;
      autoGrow(t);
      scheduleSave();
    });
  });
  wrap.querySelectorAll('.tag-input').forEach(inp => {
    inp.addEventListener('input', () => { state.cards[inp.dataset.idx].tag = inp.value; scheduleSave(); });
  });
  wrap.querySelectorAll('.q-text-input').forEach(inp => {
    inp.addEventListener('input', () => { state.cards[inp.dataset.idx].question = inp.value; scheduleSave(); });
  });

  updateScoreBar();
}

function escapeHtml(s){
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function setChoice(i, ci){
  if(state.submitted) return;
  state.cards[i].userChoice = ci;
  scheduleSave();
}

function setBlank(cardIdx, rowIdx, blankIdx, val){
  if(state.submitted) return;
  state.cards[cardIdx].rows[rowIdx].blanks[blankIdx].userChoice = parseInt(val, 10);
  scheduleSave();
  renderCards();
}

function selectChip(cardIdx, poolIdx){
  if(state.submitted) return;
  const c = state.cards[cardIdx];
  c.poolSel = (c.poolSel === poolIdx) ? null : poolIdx;
  scheduleSave();
  renderCards();
}

function tapSlot(cardIdx, rowIdx, blankIdx){
  if(state.submitted) return;
  const c = state.cards[cardIdx];
  const b = c.rows[rowIdx].blanks[blankIdx];
  if(b.userChoice !== null && b.userChoice !== undefined){ b.userChoice = null; }
  else if(c.poolSel !== null && c.poolSel !== undefined){ b.userChoice = c.poolSel; c.poolSel = null; }
  scheduleSave();
  renderCards();
}

function setFollowup(cardIdx, fuIdx, ci){
  if(state.submitted) return;
  state.cards[cardIdx].followups[fuIdx].userChoice = ci;
  scheduleSave();
}

function setMatchChoice(cardIdx, pairIdx, val){
  if(state.submitted) return;
  state.cards[cardIdx].pairs[pairIdx].userChoice = parseInt(val, 10);
  scheduleSave();
}

function moveItem(cardIdx, itemIdx, dir){
  if(state.submitted) return;
  const items = state.cards[cardIdx].items;
  const target = itemIdx + dir;
  if(target < 0 || target >= items.length) return;
  [items[itemIdx], items[target]] = [items[target], items[itemIdx]];
  scheduleSave();
  renderCards();
}

function submitAll(){
  const hasAuto = state.cards.some(c => c.kind === 'mcq' || c.kind === 'table' || c.kind === 'match' || c.kind === 'order');
  const hasMcq = hasAuto;
  const hasOpen = state.cards.some(c => c.kind === 'open' || (c.followups||[]).some(f => f.kind === 'open'));
  state.submitted = true;
  scheduleSave();
  renderCards();
  if(hasMcq && !hasOpen) showToast('ตรวจ MCQ เรียบร้อย ดูคะแนนด้านบน');
  else if(hasMcq && hasOpen) showToast('ตรวจ MCQ แล้ว ข้อเขียนรอ Claude ตรวจหลัง Export');
  else showToast('บันทึกคำตอบแล้ว กด Export เพื่อส่งให้ Claude ตรวจ');
}

function redo(){
  state.submitted = false;
  scheduleSave();
  renderCards();
}

function updateScoreBar(){
  let total = 0, correct = 0;
  state.cards.forEach(c => {
    if(c.kind === 'mcq'){
      total++; if(c.userChoice === c.answerIndex) correct++;
    } else if(c.kind === 'table'){
      (c.rows||[]).forEach(r => (r.blanks||[]).forEach(b => {
        total++; if(b.userChoice === b.answerIndex) correct++;
      }));
    } else if(c.kind === 'match'){
      (c.pairs||[]).forEach(p => { total++; if(p.userChoice === p.answerIndex) correct++; });
    } else if(c.kind === 'order'){
      const items = c.items || [];
      if(items.length){
        total++;
        if(items.every((it, ii) => it.orig === ii)) correct++;
      }
    }
    (c.followups||[]).forEach(f => {
      if(f.kind === 'mcq'){ total++; if(f.userChoice === f.answerIndex) correct++; }
    });
  });
  const bar = document.getElementById('scoreBar');
  if(!state.submitted || total === 0){ bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  bar.innerHTML = `<span>คะแนนที่ตรวจอัตโนมัติ: ${correct} / ${total}</span><span class="redo" onclick="redo()">แก้ไขคำตอบใหม่</span>`;
}

function updateCount(idx){
  const a = state.cards[idx].a || '';
  const words = a.trim().length ? a.trim().split(/\s+/).length : 0;
  const wc = document.getElementById('wc-'+idx);
  if(wc) wc.textContent = `${a.length} ตัวอักษร · ${words} คำ`;
}

function addCard(){
  state.cards.push({ kind:'open', tag:'', question:'', a:'' });
  scheduleSave();
  renderCards();
  window.scrollTo(0, document.body.scrollHeight);
}

function removeCard(i){
  if(state.cards.length === 1){ state.cards[0] = { kind:'open', tag:'', question:'', a:'' }; }
  else { state.cards.splice(i,1); }
  scheduleSave();
  renderCards();
}

function clearAll(){
  if(!confirm('ล้างข้อมูลทั้งหมดในกระดาษคำตอบนี้?')) return;
  state = { subject:'', examdate:'', submitted:false, cards:[{ kind:'open', tag:'', question:'', a:'' }] };
  document.getElementById('subject').value = '';
  document.getElementById('examdate').value = '';
  scheduleSave();
  renderCards();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      return true;
    }catch(e2){ return false; }
  }
}

function copyAll(){
  const subj = document.getElementById('subject').value || '';
  const date = document.getElementById('examdate').value || '';
  const header = (subj || date) ? [subj, date].filter(Boolean).join(' — ') + '\n\n' : '';
  const fuText = (c) => {
    if(!(c.followups||[]).length) return '';
    const lines = c.followups.map((f, fi) => {
      if(f.kind === 'mcq'){
        const ch = (f.userChoice!==null && f.userChoice!==undefined) ? f.choices[f.userChoice] : '(ยังไม่ได้เลือก)';
        return `  คำถามต่อเนื่อง ${fi+1}: ${f.question}\n  เลือกตอบ: ${ch}`;
      }
      return `  คำถามต่อเนื่อง ${fi+1}: ${f.question}\n  คำตอบ: ${f.a || '(ยังไม่ได้ตอบ)'}`;
    }).join('\n\n');
    return `\n\n${lines}`;
  };
  const blocks = state.cards.map((c,i) => {
    const label = c.tag ? ` (${c.tag})` : '';
    const q = c.question ? `${c.question}\n\n` : '';
    if(c.kind === 'mcq'){
      const chosen = (c.userChoice!==null && c.userChoice!==undefined) ? c.choices[c.userChoice] : '(ยังไม่ได้เลือก)';
      return `ข้อ ${i+1}${label} (MCQ):\n${q}เลือกตอบ: ${chosen}` + fuText(c);
    }
    if(c.kind === 'table'){
      const rowsText = (c.rows||[]).map((r, ri) => {
        if(!(r.blanks||[]).length) return null;
        const context = (r.values||[]).map((v, ci) => (r.blanks.some(b => b.col === ci)) ? '[ช่องว่าง]' : v).join(' | ');
        const picks = r.blanks.map(b => {
          const opts = b.choices || c.pool || [];
          const chosen = (b.userChoice!==null && b.userChoice!==undefined) ? opts[b.userChoice] : '(ยังไม่ได้เลือก)';
          const colName = (c.columns||[])[b.col] || ('คอลัมน์ ' + (b.col+1));
          return `${colName} = ${chosen}`;
        }).join(', ');
        return `แถว ${ri+1} (${context}): ${picks}`;
      }).filter(Boolean).join('\n');
      return `ข้อ ${i+1}${label} (ตาราง):\n${q}${rowsText}` + fuText(c);
    }
    if(c.kind === 'match'){
      const rowsText = (c.pairs||[]).map(p => {
        const chosen = (p.userChoice!==null && p.userChoice!==undefined) ? c.choices[p.userChoice] : '(ยังไม่ได้เลือก)';
        return `${p.left} → ${chosen}`;
      }).join('\n');
      return `ข้อ ${i+1}${label} (จับคู่):\n${q}${rowsText}` + fuText(c);
    }
    if(c.kind === 'order'){
      const rowsText = (c.items||[]).map((it, ii) => `${ii+1}. ${it.text}`).join('\n');
      return `ข้อ ${i+1}${label} (เรียงลำดับ):\n${q}ลำดับที่เรียง:\n${rowsText}` + fuText(c);
    }
    return `ข้อ ${i+1}${label}:\n${q}คำตอบ:\n${c.a || '(ยังไม่ได้ตอบ)'}` + fuText(c);
  });
  const intro = 'นี่คือผลที่ทำในกระดาษคำตอบครบทุกข้อ (รวม MCQ ที่เลือกไว้)\n\n';
  const outro = '\n\n---\n\nช่วยตรวจทุกข้อใหม่ทั้งหมดรวมทั้ง MCQ ด้วย ระบุว่าข้อไหนพลาดเพราะเลือก '
    + 'choice ผิดตัวไหน สับสนกับอะไร แล้วสรุปคะแนนรวม และวิเคราะห์จุดอ่อนทั้งชุดตาม '
    + 'workflow ที่เคยกำหนดไว้ต่อเลย';
  const full = intro + header + blocks.join('\n\n---\n\n') + outro;
  copyText(full).then(ok => showToast(ok ? 'คัดลอกแล้ว วางในแชทได้เลย' : 'คัดลอกไม่สำเร็จ'));
}

document.getElementById('subject').addEventListener('input', e => { state.subject = e.target.value; scheduleSave(); });
document.getElementById('examdate').addEventListener('input', e => { state.examdate = e.target.value; scheduleSave(); });

load();
</script>
</body>
